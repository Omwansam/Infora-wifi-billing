user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Original client protocol, preserved across proxy hops.
    #
    # $scheme is the protocol of the hop THIS server received, so behind an
    # edge proxy that terminates TLS it is always "http" — and setting
    # X-Forwarded-Proto from it OVERWRITES the "https" the edge already sent.
    # That is what made Flask mint WebFig one-click URLs as http:// (leaking the
    # signed session token into a plaintext URL) and set the session cookie
    # without Secure. Trust an inbound value, fall back to $scheme when direct.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    include /etc/nginx/snippets/cloudflare.conf;
    include /etc/nginx/conf.d/*.conf;
}
