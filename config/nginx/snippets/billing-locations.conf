root /usr/share/nginx/html;
index index.html;

# Flask API (admin, portal, M-Pesa callbacks, health)
location /api/ {
    proxy_pass http://flask_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 60s;
    # Router SSH ops over the tunnel run tens of seconds (see the edge vhost
    # note); 120s cut off the wizard's configure-services step.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# React SPA (dashboard, /portal captive pages)
location / {
    try_files $uri $uri/ /index.html;
}
