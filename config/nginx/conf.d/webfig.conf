# WebFig one-click router proxy — webfig.<domain>.
#
# Serves the ENTIRE origin from Flask, which routes on the Host header and
# streams to the router's WebFig over the management WireGuard tunnel. There is
# deliberately no `root` and no try_files: RouterOS 7 serves WebFig from
# root-absolute paths (/assets/..., plus an inline `location.href = "/webfig/"`),
# so anything served locally here would shadow the router.
#
# This block lives in the web image rather than in the edge proxy's vhost so that
# a deployment terminating TLS upstream needs only one upstream for billing —
# and, more importantly, so flask_app never has to join a shared Docker network
# where another tenant's container already answers to the name `postgres`.
server {
    listen 80;
    server_name webfig.ruirufactorymabati.com;

    # Staff-only tooling.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 64m;

    location / {
        proxy_pass http://flask_api;
        proxy_http_version 1.1;
        # Host IS the routing key — Flask picks the session, and therefore the
        # device, out of it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # A router's UI streams; buffering adds latency and breaks long polls.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
