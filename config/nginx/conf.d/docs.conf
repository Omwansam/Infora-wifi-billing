# Lumen documentation — docs.<domain>
#
# The docs are ROUTES INSIDE the Lumen marketing bundle (/docs/:slug), not a
# separate build. So this vhost serves the same root as lumen.conf and differs
# in exactly one way: its bare root redirects into /docs, because a visitor
# typing the docs subdomain wants the documentation, not the landing page.
#
# The redirect is external (302, not an internal rewrite) on purpose — the
# React router has to see /docs/... in the address bar to match its routes, and
# an internal rewrite would hand it "/" and render the marketing homepage.

server {
    listen 80;
    server_name docs.ruirufactorymabati.com;

    root /usr/share/nginx/lumen;
    index index.html;

    # Emit a RELATIVE Location header. TLS is terminated at the edge proxy, so
    # this nginx only ever sees plain HTTP; with absolute redirects on (the
    # default) it rebuilds the redirect as http://docs.../docs/introduction and
    # downgrades the scheme on the way in. A relative Location lets the browser
    # keep the https it already had.
    absolute_redirect off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Only the bare root. Deep links such as /docs/quickstart, and the hashed
    # asset paths below, must fall through untouched.
    location = / {
        return 302 /docs/introduction;
    }

    # Immutable hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — this is what makes /docs/<slug> work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

