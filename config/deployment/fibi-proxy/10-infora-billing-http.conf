# Infora / Lumen billing — port 80.
#
# Included into the FIBI edge proxy's http block. Kept in a separate file from
# the HTTPS block on purpose: nginx refuses to start when a server block names a
# certificate that is not on disk, and this proxy also fronts fibicommunity.org,
# visionmentors.org and draftbitlabs.tech — a missing file here would take down
# three sites that have nothing to do with billing. Install this file first; add
# 20-infora-billing-https.conf only after ./scripts/publish-origin-cert.sh has
# put the Cloudflare Origin pair on the cert volume.
#
# Upstreams are addressed by the aliases set in docker-compose.fibi.yml, never
# by bare service names. Docker's embedded DNS answers a service name with every
# container carrying it, and four stacks share this network.

# The billing web image serves all three sites and proxies /api to Flask
# internally, so host-based routing happens inside it — one upstream is enough.
upstream infora_billing_web {
    server infora-billing-web:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ruirufactorymabati.com
                www.ruirufactorymabati.com
                billing.ruirufactorymabati.com
                demo.ruirufactorymabati.com
                lumen.ruirufactorymabati.com
                webfig.ruirufactorymabati.com;

    # TLS here is a Cloudflare Origin certificate, so nothing needs an ACME
    # challenge today. Kept because the webroot volume is already mounted for
    # the other tenants, and it must never sit behind the redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
