# Infora / Lumen billing — port 443.
#
# INSTALL ONLY AFTER the certificate is on the volume:
#   ./scripts/publish-origin-cert.sh
# nginx will not start if fullchain.pem is missing or empty, and this proxy
# fronts three other live sites.
#
# Upstreams and the port-80 block live in 10-infora-billing-http.conf.
#
# Inherited from the FIBI http block, deliberately not repeated here:
#   proxy_set_header Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto
# Host is preserved, which matters twice over: the billing web image routes the
# three sites by Host, and Flask picks the WebFig session out of it.
#
# Rate limiting is deliberately NOT applied. Captive-portal clients, router
# provisioning fetches and the device poller all hit this origin in bursts that
# look nothing like human browsing, and the auth bucket (10r/m) would lock out
# a hotspot during onboarding. Add limit_req here only after watching real
# traffic.

# apex + www -> Lumen marketing site (the web image 301s lumen. -> apex itself)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruirufactorymabati.com
                www.ruirufactorymabati.com
                lumen.ruirufactorymabati.com
                demo.ruirufactorymabati.com;

    ssl_certificate     /etc/letsencrypt/live/ruirufactorymabati.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruirufactorymabati.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ISP logo uploads and CSV subscriber imports exceed the proxy's 25m default.
    client_max_body_size 32m;
    limit_conn conn_limit 50;

    location / {
        proxy_pass http://infora_billing_web;
    }
}

# Billing admin console + captive portal + API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name billing.ruirufactorymabati.com;

    ssl_certificate     /etc/letsencrypt/live/ruirufactorymabati.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruirufactorymabati.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;
    limit_conn conn_limit 50;

    # Router operations go over SSH through the WireGuard tunnel and are SLOW:
    # a single read-only /interfaces call on an RB3011 measures ~19s, and the
    # wizard's configure-services pushes bridge/pool/DHCP/PPPoE/hotspot in one
    # session. The edge proxy's http-level default is 60s, which this vhost
    # would otherwise inherit — that is what returned 504 on wizard step 4 while
    # the app was still working and would have finished.
    #
    # Cloudflare independently gives up at ~100s with a 524, so this ceiling is
    # generous rather than unlimited: anything genuinely slower than 100s has to
    # become an async job, not a longer timeout.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # The captive portal is opened inside a phone's captive-network mini browser
    # and must be framable by it, so no X-Frame-Options here.
    location / {
        proxy_pass http://infora_billing_web;
    }
}

# WebFig one-click router proxy.
#
# Goes to the billing web image, whose webfig.conf forwards the whole origin
# to Flask. The whole origin is forwarded because: RouterOS 7 serves WebFig from root-absolute
# paths (/assets/..., plus an inline `location.href = "/webfig/"`), so anything
# served locally here would shadow the router. No root, no try_files, on purpose.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webfig.ruirufactorymabati.com;

    ssl_certificate     /etc/letsencrypt/live/ruirufactorymabati.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruirufactorymabati.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    # Staff-only tooling.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 64m;

    location / {
        proxy_pass http://infora_billing_web;
        # A router's UI streams; buffering it adds latency and breaks long polls.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
