# Deploy to /opt/dan/deploy/nginx/conf.d/webfig-ruirufactory.conf
# Then: docker exec dan-proxy-1 nginx -t && docker exec dan-proxy-1 nginx -s reload
# Never recreate that container — it fronts other live sites.
#
# Requires: Cloudflare A record `webfig` -> 5.189.178.15, PROXIED (orange).
# Proxied is mandatory: the origin serves a Cloudflare Origin CA cert that
# browsers do not trust, so a grey-cloud record fails TLS in the browser.
# Also requires WEBFIG_PROXY_DOMAIN=ruirufactorymabati.com in the prod .env.
#
# Infora — WebFig one-click proxy.
#
# Proxies the ENTIRE origin to Flask, which routes on the Host header and streams
# to the router's WebFig over the management WireGuard tunnel. There is no `root`
# and no try_files on purpose: RouterOS 7 serves WebFig from root-absolute paths
# (/assets/..., and an inline `location.href = "/webfig/"`), so anything served
# locally here would shadow the router. Host must be preserved — Flask picks the
# session, and therefore the device, out of it.
server {
    listen 80;
    server_name webfig.ruirufactorymabati.com;

    client_max_body_size 64m;

    location / {
        proxy_pass http://172.17.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name webfig.ruirufactorymabati.com;

    ssl_certificate /etc/nginx/ssl/ruirufactory.crt;
    ssl_certificate_key /etc/nginx/ssl/ruirufactory.key;

    client_max_body_size 64m;

    location / {
        proxy_pass http://172.17.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
