# Production overlay — use WITH your existing host nginx (dan-proxy / Vision).
# Billing does NOT bind ports 80/443. Flask listens on 127.0.0.1:5080 for the proxy.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Optional bundled nginx (only if 80/443 are free on the host):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile bundled-nginx up -d

services:
  web:
    profiles:
      - bundled-nginx
    build:
      context: .
      dockerfile: config/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://ruirufactorymabati.com}
        VITE_RADIUS_SERVER: ${PUBLIC_SERVER_HOST}
        VITE_FREERADIUS_HOST: ${PUBLIC_SERVER_HOST}
        # lumen.<domain> marketing site + demo.<domain> interactive demo
        LUMEN_SITE_URL: ${LUMEN_SITE_URL:-https://lumen.ruirufactorymabati.com}
        LUMEN_APP_URL: ${LUMEN_APP_URL:-https://ruirufactorymabati.com}
        LUMEN_DEMO_URL: ${LUMEN_DEMO_URL:-https://demo.ruirufactorymabati.com}
        LUMEN_MARKETING_URL: ${LUMEN_SITE_URL:-https://lumen.ruirufactorymabati.com}
    container_name: infora_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/nginx:/etc/nginx/ssl:ro
    depends_on:
      flask_app:
        condition: service_started
    networks:
      - infora_network
    restart: unless-stopped

  flask_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: !override
      - "5080:5000"
    depends_on: !override
      postgres:
        condition: service_healthy
      freeradius:
        condition: service_started
    # Pass the WHOLE .env into the container. The explicit `environment:` keys
    # below still win, so nothing here changes — but a var that is only in .env
    # (MAIL_*, SMS_*, DEVICE_*, TENANT_BASE_DOMAIN, …) now actually reaches the
    # app instead of being silently dropped. That drop has bitten this deploy
    # three times (PORTAL_BASE_URL, then PLATFORM_*); this ends the pattern.
    # Note: a compose env change needs `up -d`, not `build` or `restart`.
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PUBLIC_SERVER_HOST: ${PUBLIC_SERVER_HOST}
      FREERADIUS_HOST: ${FREERADIUS_HOST:-freeradius}
      RADIUS_SECRET: ${RADIUS_SECRET}
      RADIUS_CLIENTS_CONF_PATH: /config/freeradius/clients.conf
      WIREGUARD_CONFIG_DIR: /app/wireguard_configs
      WIREGUARD_MIKROTIK_AUTO_PUSH: ${WIREGUARD_MIKROTIK_AUTO_PUSH:-true}
      WIREGUARD_MGMT_ENDPOINT: ${WIREGUARD_MGMT_ENDPOINT:-${PUBLIC_SERVER_HOST}}
      WIREGUARD_MGMT_PORT: ${WIREGUARD_MGMT_PORT:-51821}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PROVISION_BASE_URL: ${PROVISION_BASE_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Captive-portal SPA origin. MUST be passed here — otherwise the container
      # inherits the base compose's dev default (http://localhost:5173) and the
      # hotspot login page redirects to an address phones can't reach (blank).
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-}
      # Domain the WebFig proxy hostname hangs off (webfig.<domain>). Must be a
      # name the TLS cert covers — Universal SSL covers *.ruirufactorymabati.com
      # but not a second level under billing. Unset ⇒ derived from the request,
      # which yields the uncovered sub-sub-domain.
      WEBFIG_PROXY_DOMAIN: ${WEBFIG_PROXY_DOMAIN:-}
      ROUTER_TIMEZONE: ${ROUTER_TIMEZONE:-Africa/Nairobi}
      LOGO_UPLOAD_DIR: /app/uploads/logos
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      # Platform subscription — what a tenant ISP pays us. All have working
      # defaults in config.py, but they must be passed through here or .env
      # cannot tune them (the PORTAL_BASE_URL trap). Grace 0 = console locks
      # the moment the subscription expires. See SUBSCRIPTION.md.
      PLATFORM_VENDOR_NAME: ${PLATFORM_VENDOR_NAME:-Lumen}
      PLATFORM_TRIAL_DAYS: ${PLATFORM_TRIAL_DAYS:-14}
      PLATFORM_BILLING_PERIOD_DAYS: ${PLATFORM_BILLING_PERIOD_DAYS:-30}
      PLATFORM_GRACE_DAYS: ${PLATFORM_GRACE_DAYS:-0}
      PLATFORM_ISSUE_LEAD_DAYS: ${PLATFORM_ISSUE_LEAD_DAYS:-7}
      # TR-069 ACS. The URL must be reachable from the *subscriber* network and
      # served DNS-only (grey cloud) — a CDN/WAF in front of CWMP mangles SOAP
      # POSTs, and budget ONTs fail on modern TLS chains. See TR069.md.
      TR069_ACS_URL: ${TR069_ACS_URL:-}
      # Off by default in production: the ACS is exposed to the whole internet,
      # so only pre-enrolled devices (with credentials) may register.
      TR069_ALLOW_UNKNOWN: ${TR069_ALLOW_UNKNOWN:-false}
      TR069_PERIODIC_INFORM_INTERVAL: ${TR069_PERIODIC_INFORM_INTERVAL:-300}
      TR069_SESSION_RETENTION_DAYS: ${TR069_SESSION_RETENTION_DAYS:-7}
    volumes: !override
      - wireguard_configs:/app/wireguard_configs
      - isp_uploads:/app/uploads
      - ./config/freeradius/clients.conf:/config/freeradius/clients.conf
      - ./certs:/app/certs
    command: ["/app/docker-entrypoint.prod.sh"]
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: !override []
    restart: unless-stopped

  freeradius:
    environment:
      RADIUS_SECRET: ${RADIUS_SECRET}
    restart: unless-stopped

  wireguard:
    ports: !override
      - "51820:51820/udp"
      - "51821:51821/udp"
    volumes:
      - wireguard_configs:/config
      - /lib/modules:/lib/modules:ro
      - ./config/wireguard/custom-cont-init.d:/custom-cont-init.d:ro
    restart: unless-stopped

  openldap:
    profiles:
      - ldap
    restart: unless-stopped
    ports: !override []

  ldap_admin:
    profiles:
      - dev

  frontend:
    profiles:
      - dev
